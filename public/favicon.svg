<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- XEEROO Geometric X Blade 1 (top-left to bottom-right) -->
  <path d="M14 16 L22 16 L50 48 L42 48 Z" fill="url(#blueGlow)" filter="url(#glow)"/>
  
  <!-- XEEROO Geometric X Blade 2 (top-right to bottom-left with dynamic gap & chamfer) -->
  <path d="M42 16 L50 16 L36 32 L30 26 Z" fill="url(#cyanAccent)"/>
  <path d="M28 38 L34 44 L22 48 L14 48 Z" fill="url(#cyanAccent)"/>

  <!-- Core Cyber Diamond Accent -->
  <polygon points="32,28 36,32 32,36 28,32" fill="#e0f2fe"/>
</svg>
