<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="logoBlueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="logoCyanAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem Icon Container -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="url(#logoBgGrad)"/>
    <rect width="56" height="56" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Dynamic Blade 1 -->
    <path d="M12 14 L19 14 L44 42 L37 42 Z" fill="url(#logoBlueGlow)" filter="url(#logoGlow)"/>
    
    <!-- Dynamic Blade 2 -->
    <path d="M37 14 L44 14 L31 28 L26 23 Z" fill="url(#logoCyanAccent)"/>
    <path d="M25 33 L30 39 L19 42 L12 42 Z" fill="url(#logoCyanAccent)"/>

    <!-- Central Diamond Core -->
    <polygon points="28,24 32,28 28,32 24,28" fill="#e0f2fe"/>
  </g>

  <!-- Typography: XEEROO -->
  <g transform="translate(74, 41)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4" fill="#0f172a">
      XEEROO
    </text>
  </g>
</svg>
